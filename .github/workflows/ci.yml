name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets --locked -- -D warnings
      - run: cargo test --release --locked
      - name: Binary stays small
        run: cargo build --release --locked && size=$(wc -c < target/release/sharks-game) && echo "$size bytes" && test "$size" -lt 550000

  demos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: README animations are up to date
        run: |
          SHARKS_DEMO=docs cargo test --release --locked write_demos
          git diff --exit-code -- docs
